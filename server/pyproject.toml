[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-lite"
version = "0.1.0"
description = "Antigravity 2.0 Script-First and Token-Optimized Ops Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ops_lite*"]
